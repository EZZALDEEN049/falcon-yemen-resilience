name: Manuscript Evidence Status Step 1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/revision-step1-trigger.txt'
permissions:
  contents: write
concurrency:
  group: manuscript-revision-step1
  cancel-in-progress: false
jobs:
  update-document:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document manipulation dependency
        run: python -m pip install 'python-docx>=1.1,<2'
      - name: Apply only four evidence-status corrections
        run: python tools/update_manuscript_evidence_status.py
      - name: Commit updated DOCX without changing prior manuscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/Manuscript_2026-10-24_Evidence_Status_Updated.docx
          if git diff --cached --quiet; then
            echo "Document is already committed"
          else
            git commit -m 'Revise manuscript evidence status (step 1 only)'
            git push origin HEAD:main
          fi
