name: Audit original published IODA 2020 rasters and axes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ioda-2020-source-raster-audit-2026.yml'
      - 'tools/audit_ioda2020_source_rasters.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Retrieve article-linked original pixels; verify image geometry and RGB
        run: python tools/audit_ioda2020_source_rasters.py
      - name: Preserve source images for internal verification only - not publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioda-2020-publisher-internal-review-${{ github.run_id }}
          path: _artifacts/ioda2020_publisher_raster/
          retention-days: 7
      - name: Commit ONLY derived audit metadata (no third-party imagery)
        run: |
          mkdir -p results/ioda2020_source_audit
          cp _artifacts/ioda2020_publisher_raster/source_raster_audit.json results/ioda2020_source_audit/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/ioda2020_source_audit/source_raster_audit.json
          git diff --cached --quiet || (git commit -m "Audit published IODA Jan 2020 source raster access and pixel geometry" && git push origin HEAD:main)
