name: IODA 2020 Wayback Archive Audit
on:
  push:
    branches: [main]
    paths: ['.github/ioda-wayback-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit historic API URL snapshots from independent archives
        run: python tools/ioda_wayback_audit.py
      - name: Keep source responses and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ioda-2020-wayback-availability
          path: _artifacts/ioda_2020_wayback/
          retention-days: 30
