name: Verify Zenodo ingestion for FALCON software v1.0.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-zenodo-falcon-v1.0.2.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Read Zenodo previous release, version series and public search
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,time
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'FALCON-DOI-audit/1.0','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          prev=get('https://zenodo.org/api/records/23751733')
          print('OLD_VERIFIED',prev.get('id'),prev.get('metadata',{}).get('version'),prev.get('pids',{}).get('doi'))
          print('PARENT_AND_VERSION_LINKS',json.dumps({'parent':prev.get('parent'),'links':{k:v for k,v in prev.get('links',{}).items() if 'version' in k.lower()}},default=str)[:1200])
          candidates=[
             'https://zenodo.org/api/records?q=FALCON&size=25',
             'https://zenodo.org/api/records?q=FALCON%20Yemen%202020&size=25',
             'https://zenodo.org/api/records/23751733/versions?size=25',
          ]
          for k,v in prev.get('links',{}).items():
             if 'version' in k.lower() and isinstance(v,str) and v.startswith('https://zenodo.org/api/'):candidates.append(v)
          successes=[]
          for attempt in range(3):
            for url in dict.fromkeys(candidates):
              try:
                d=get(url)
                hits=d.get('hits',{}).get('hits',[]) if isinstance(d.get('hits'),dict) else ([d] if d.get('id') else [])
                for r in hits:
                  md=r.get('metadata',{}); title=md.get('title',''); ver=str(md.get('version',''))
                  if 'FALCON' in title.upper():
                    doi=(r.get('pids',{}).get('doi') or {}).get('identifier') or r.get('doi')
                    row={'id':r.get('id'),'title':title,'version':ver,'doi':doi}
                    if row not in successes: successes.append(row)
              except Exception as e:print('QUERY_ERROR',url.split('?')[0],str(e)[:100])
            matched=[x for x in successes if x['version'].startswith('1.0.2') and 'Software' in x['title'] and x['doi']]
            print('MATCHED',json.dumps(matched))
            if matched:break
            if attempt<2:time.sleep(20)
          print('RELATED_RECORDS',json.dumps(successes[:50]))
          if not matched:raise SystemExit('Zenodo software v1.0.2 DOI still unverified')
          PY
