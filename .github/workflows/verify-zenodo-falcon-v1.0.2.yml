name: Verify Zenodo ingestion for FALCON software v1.0.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-zenodo-falcon-v1.0.2.yml']
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify exact Zenodo record metadata, author, software version, archived files
        run: |
          python - <<'PY'
          import json,urllib.request
          url='https://zenodo.org/api/records/23783359'
          req=urllib.request.Request(url,headers={'User-Agent':'FALCON-final-archive-audit/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=40) as response:d=json.load(response)
          md=d['metadata'];title=md['title'];version=str(md['version'])
          doi=d.get('doi') or (d.get('pids',{}).get('doi') or {}).get('identifier')
          if isinstance(doi,dict):doi=doi.get('identifier')
          assert d['id']==23783359 and version=='1.0.2' and doi=='10.5281/zenodo.23783359'
          assert 'Research Software' in title
          creators=md.get('creators',[])
          assert len(creators)==1 and 'Al-Tayar' in str(creators[0])
          licensing=md.get('rights',[]) or md.get('license')
          fileobj=d.get('files',[]) 
          entries=fileobj.get('entries',{}) if isinstance(fileobj,dict) else fileobj
          assets=[{'name':k,'size':v.get('size'),'checksum':v.get('checksum')} for k,v in entries.items()] if isinstance(entries,dict) else entries
          assert assets and any('zip' in str(a).lower() for a in assets),'no archived source zip visible'
          print('ZENODO_V1_0_2_VERIFIED',json.dumps({'record_id':d['id'],'title':title,'version':version,'doi':doi,'creators':creators,'license':licensing,'files':assets},default=str)[:4000])
          PY
