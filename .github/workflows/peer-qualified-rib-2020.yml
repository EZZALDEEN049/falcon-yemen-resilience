name: Peer-Qualified RIPE 2020 RIB audit
on:
  push:
    branches: [main]
    paths: ['.github/peer-qualified-rib-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install native MRT decoder
        run: python -m pip install pybgpkit-parser
      - name: Verify two complete 2020 historical RIPE RIS snapshots and independent peer coverage
        run: python tools/peer_qualified_rib_2020.py
      - name: Preserve audit data only; no misleading cable attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-qualified-2020-rrc00-two-RIB-audit
          path: _artifacts/2020_ripe_peer_coverage/
          retention-days: 30
