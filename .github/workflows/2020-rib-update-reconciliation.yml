name: FALCON 2020 Full Event-to-RIB Reconciliation
on:
  push:
    branches: [main]
    paths: ['.github/2020-rib-reconcile-trigger.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pybgpkit-parser
      - uses: actions/download-artifact@v4
        with:
          pattern: 2020-rrc00-replay-events-chunk-*
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 40251514376
          github-token: ${{ github.token }}
          path: _tmp/2020_replay_chunks
      - uses: actions/download-artifact@v4
        with:
          name: bgp-discovery-30873-rrc00
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 39879372678
          github-token: ${{ github.token }}
          path: _tmp/30873
      - uses: actions/download-artifact@v4
        with:
          name: bgp-discovery-12486-rrc00
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 39879372678
          github-token: ${{ github.token }}
          path: _tmp/12486
      - name: Exact peer-prefix source RIB to full A/W event-state replay
        id: check
        continue-on-error: true
        run: python tools/ripe_2020_full16h_event_state_reconcile.py
      - name: Permanently audit even if replay is NOT reconciled
        if: always()
        run: |
          if [ -f _artifacts/2020_ripe_verified_full_replay/full_replay_validation.json ]; then
            mkdir -p results
            cp _artifacts/2020_ripe_verified_full_replay/full_replay_validation.json results/ripe_2020_full16h_replay_checkpoint_audit.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/ripe_2020_full16h_replay_checkpoint_audit.json
            git diff --cached --quiet || (git commit -m "Audit original 2020 full A/W replay against subsequent RIB" && git push)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-2020-event-state-replay-audit
          path: _artifacts/2020_ripe_verified_full_replay/
          retention-days: 30
      - name: Release metrics only after original RIB reconciliation
        if: always()
        run: test "${{ steps.check.outcome }}" = success
