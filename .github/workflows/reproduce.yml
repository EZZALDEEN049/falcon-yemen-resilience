name: Reproduce and Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test scientific guardrails
        run: python tests/test_guardrails.py
      - name: Reproduce derived evidence (not native signals)
        run: python code/reproduce_all.py
      - name: Verify reported derived numbers
        run: python tools/check_reproduction.py
      - name: Upload derived outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-evidence
          path: |
            results/*.json
            results/*.csv
            figures/*.png
          retention-days: 14
