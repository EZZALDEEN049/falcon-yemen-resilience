name: Predeclared Jan 2-3 2020 RIPE RIS 16h reference
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ripe2020-non-event-16h-baseline.yml'
      - 'tools/ripe2020_non_event_20200102_20200103.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Index this reference-window run ID for reproducible diagnostics
        run: |
          mkdir -p results/ripe2020_reference_20200102
          printf '{"run_id":%s,"status":"STARTED_NOT_VALIDATED","window":["2020-01-02T08:00:00Z","2020-01-03T00:00:00Z"],"collectors":["rrc00","rrc01","rrc10"]}\n' "$GITHUB_RUN_ID" > results/ripe2020_reference_20200102/PROCESSING_STATUS.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/ripe2020_reference_20200102/PROCESSING_STATUS.json
          git diff --cached --quiet || (git commit -m "Record predeclared BGP reference extraction CI run identifier" && git push origin HEAD:main)
  baseline:
    needs: announce
    strategy:
      fail-fast: false
      matrix:
        collector: [rrc00, rrc01, rrc10]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FALCON_RRC: ${{ matrix.collector }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check extracted baseline script syntax before large source downloads
        run: python -m py_compile tools/ripe2020_non_event_20200102_20200103.py
      - run: python -m pip install pybgpkit-parser
      - name: Download 2 original historical RIBs, validate gzip, capture hashes, export all observations
        run: python tools/ripe2020_non_event_20200102_20200103.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-jan02-${{ matrix.collector }}-${{ github.run_id }}
          path: _artifacts/2020_ripe_peer_coverage_${{ matrix.collector }}
          retention-days: 30
  publish:
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reference-jan02-*
          path: baseline_artifacts
      - name: Check and merge original RIB observations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          base=Path('baseline_artifacts')
          output=Path('results/ripe2020_reference_20200102')
          for collector in ('rrc00','rrc01','rrc10'):
              matches=[x for x in base.glob('reference-jan02-'+collector+'-*') if (x/'individual_output_status.json').is_file()]
              if len(matches)!=1: raise RuntimeError(f'No unique {collector} artifact')
              src=matches[0]
              status=json.loads((src/'individual_output_status.json').read_text())
              if status['status']!='PREDECLARED_NON_EVENT_BASELINE_SOURCE_RIBS_PROCESSED': raise RuntimeError('Invalid source')
              d=output/collector;d.mkdir(parents=True,exist_ok=True)
              for f in src.glob('*'):shutil.copy2(f,d/f.name)
          PY
      - name: Store separate complete baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: original-2020-non-event-jan02-RIB-reference-${{ github.run_id }}
          path: results/ripe2020_reference_20200102/
          retention-days: 30
      - name: Commit source-audited baseline data for reviewer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/ripe2020_reference_20200102
          git diff --cached --quiet || (git commit -m "Archive Jan 2-3 2020 reference BGP original-RIB observations" && git push origin HEAD:main)
