name: Locate RIPE Atlas Historical Ping From Yemen Probes
on:
  push:
    branches: [main]
    paths: ['.github/yemen-2020-probe-source-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/locate_ripe_atlas_2020_yemen_probes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-native-yemeni-probe-2020-global-ping-availability
          path: _artifacts/2020_yemeni_ripe_atlas_source_probe_audit/
          retention-days: 30
