name: Full Research Pipeline
on:
  push:
    branches: [main]
    paths:
      - '.github/research-run.txt'
  workflow_dispatch:
    inputs:
      ioda_event:
        description: Historical IODA event to request
        type: choice
        required: true
        default: FALCON_2020
        options:
          - FALCON_2020
          - YEMEN_2022
          - FALCON_2023
      discover_bgp:
        description: Discover candidate historical BGP prefixes for both ASNs
        type: boolean
        required: true
        default: true
      bgp_collector:
        description: RIPE RIS collector used for BGP discovery
        type: choice
        required: true
        default: rrc00
        options:
          - rrc00
          - rrc01
          - rrc04
permissions:
  contents: read
jobs:
  reproduce:
    name: Test and reproduce the derived evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_guardrails.py
      - run: python code/reproduce_all.py
      - run: python tools/check_reproduction.py
      - name: Save reproduced results (derived inputs only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: derived-evidence-and-tests
          path: |
            results/*.json
            results/*.csv
            figures/*.png
          retention-days: 14
          if-no-files-found: warn
  ioda:
    name: Request native IODA data (not automatically accepted as evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Request and validate the selected historical event
        env:
          SELECTED_EVENT: ${{ inputs.ioda_event || 'FALCON_2020' }}
        run: |
          mkdir -p _artifacts/native_ioda
          python tools/run_ioda_job.py --event "$SELECTED_EVENT" --out _artifacts/native_ioda
      - name: Save raw responses and provenance even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ioda-${{ inputs.ioda_event || 'FALCON_2020' }}
          path: _artifacts/native_ioda/
          retention-days: 14
          if-no-files-found: warn
  bgp:
    name: Discover BGP candidates for AS${{ matrix.asn }} (not route reconstruction)
    if: ${{ github.event_name == 'push' || inputs.discover_bgp }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        asn: ['30873', '12486']
    steps:
      - uses: actions/checkout@v4
      - run: docker pull caida/bgpstream:latest
      - name: Query official archive metadata and candidate origin RIB
        env:
          ASN: ${{ matrix.asn }}
          COLLECTOR: ${{ inputs.bgp_collector || 'rrc00' }}
        run: |
          mkdir -p _artifacts/bgp
          START=$(date -u -d '2020-01-09 08:00:00 UTC' +%s)
          END=$(date -u -d '2020-01-09 08:45:00 UTC' +%s)
          docker run --rm caida/bgpstream:latest bgpreader -p ris -c "$COLLECTOR" -w "$START,$END" -t ribs -a "$ASN" > _artifacts/bgp/historical_origin_rib_candidates.txt
          python tools/audit_bgp_discovery.py --input _artifacts/bgp/historical_origin_rib_candidates.txt --asn "$ASN" --collector "$COLLECTOR" --out _artifacts/bgp
      - name: Save discovery evidence even when archive is missing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-discovery-${{ matrix.asn }}-${{ inputs.bgp_collector || 'rrc00' }}
          path: _artifacts/bgp/
          retention-days: 14
          if-no-files-found: warn
