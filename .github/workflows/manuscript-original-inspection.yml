name: Audit Actual Manuscript Source Structure
on:
  push:
    branches: [main]
    paths: [.github/inspect-final-manuscript-trigger.txt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install python-docx
      - run: python tools/inspect_original_manuscript.py > manuscript_structure_audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-manuscript-structure-audit
          path: |
            manuscript_structure_audit.txt
            paper/Manuscript_2026-10-24_Evidence_Status_Updated.docx
          retention-days: 7
