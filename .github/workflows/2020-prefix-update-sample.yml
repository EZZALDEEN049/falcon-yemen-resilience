name: RIPE 2020 scoped prefix updates
on:
  push:
    branches: [main]
    paths: ['.github/2020-prefix-updates-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pybgpkit-parser
      - uses: actions/download-artifact@v4
        with:
          name: bgp-discovery-30873-rrc00
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 39879372678
          github-token: ${{ github.token }}
          path: _tmp/30873
      - uses: actions/download-artifact@v4
        with:
          name: bgp-discovery-12486-rrc00
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 39879372678
          github-token: ${{ github.token }}
          path: _tmp/12486
      - run: python tools/ripe_2020_historical_candidate_update_sample.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-2020-scoped-prefix-aw-sample
          path: _artifacts/2020_historical_prefix_update_sample/
          retention-days: 30
