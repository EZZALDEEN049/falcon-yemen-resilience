name: Acquire Native IODA
on:
  workflow_dispatch:
    inputs:
      event:
        description: Historical event (2020 is priority)
        required: true
        default: FALCON_2020
        type: choice
        options:
          - FALCON_2020
          - YEMEN_2022
          - FALCON_2023
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Acquire original responses and audit validation
        id: fetch
        env:
          SELECTED_EVENT: ${{ inputs.event }}
        run: |
          mkdir -p _artifacts/raw_ioda
          python tools/run_ioda_job.py --event "$SELECTED_EVENT" --out _artifacts/raw_ioda
      - name: Upload acquisition manifest, raw responses and validated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ioda-${{ inputs.event }}
          path: _artifacts/raw_ioda/
          if-no-files-found: warn
          retention-days: 14
