name: USC public dataset metadata validation
on:
  push:
    branches: [main]
    paths: ['.github/usc-public-metadata-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/usc_a39_public_metadata_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usc-a39-public-readme-metadata-audit
          path: _artifacts/usc_2020_public_readme/
          retention-days: 30
