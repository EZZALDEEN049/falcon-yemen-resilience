name: Validate Native IODA 2023
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ioda-2023-trigger.txt'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download unmodified official 2023 IODA JSON
        run: |
          python -m pip install 'requests>=2.31,<3'
          mkdir -p _artifacts/native_2023
          python code/download_ioda_raw.py --event FALCON_2023 --out _artifacts/native_2023
      - name: Check timestamps, coverage and signal interpretation
        run: |
          python code/analyze_native_ioda_2023.py --raw _artifacts/native_2023/FALCON_2023_asn_30873.json --out _artifacts/native_2023/native_2023_AS30873_summary.json
      - name: Save exact source envelope and derived descriptive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-native-ioda-2023
          path: _artifacts/native_2023/
          retention-days: 30
          if-no-files-found: warn
