name: Publish verified Jan2-3 RIPE baseline from completed original source artifacts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-2020-reference-audited.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-frozen-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover original validated three-collector reference artifact from already completed run
        uses: actions/download-artifact@v4
        with:
          name: original-2020-non-event-jan02-RIB-reference-40609642587
          run-id: 40609642587
          github-token: ${{ github.token }}
          path: results/ripe2020_reference_20200102/
      - name: Verify six native source audit files and expected historical checkpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,hashlib
          root=Path('results/ripe2020_reference_20200102')
          for c in ['rrc00','rrc01','rrc10']:
              d=root/c
              assert (d/'audit.json').is_file()
              j=json.loads((d/'audit.json').read_text())
              assert j['status']=='VALIDATED_TWO_SNAPSHOT_DESCRIPTIVE_NOT_EVENT_CAUSAL'
              assert [x['time_utc'] for x in j['snapshots']]==['2020-01-02T08:00:00Z','2020-01-03T00:00:00Z']
              assert all(x['source']['gzip_crc']=='passed' and len(x['source']['sha256'])==64 for x in j['snapshots'])
              rows=sum(1 for _ in csv.DictReader(open(d/'BGP_2020_peer_prefix_records.csv')))
              assert rows==json.loads((d/'individual_output_status.json').read_text())['rows']
              print(c,'verified observations',rows)
          PY
      - name: Commit full reference original RIB evidence and safely rebase to concurrent main branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/ripe2020_reference_20200102/
          if git diff --cached --quiet; then
            echo "Data already preserved, no changes."
          else
            git commit -m "Archive source-audited Jan 2-3 2020 non-event RIS reference RIB data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
