name: Recover 2020 Public Ping From Historical YemenNet Prefixes
on:
  push:
    branches: [main]
    paths: ['.github/atlas-2020-prefix-target-search-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: bgp-discovery-30873-rrc00
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 39879372678
          github-token: ${{ github.token }}
          path: _tmp/30873
      - run: python tools/find_2020_public_atlas_for_original_as30873_prefixes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-2020-as30873-public-atlas-ping-target-discovery
          path: _artifacts/atlas_2020_historical_as30873_prefix_search/
          retention-days: 30
