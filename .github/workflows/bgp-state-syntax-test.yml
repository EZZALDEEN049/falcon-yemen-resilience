name: BGP state API ASN notation sanity
on:
  push:
    branches: [main]
    paths: ['.github/bgp-state-syntax-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python tools/test_bgp_state_asn_syntax.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bgp-state-asn-syntax-response-audit
          path: _artifacts/bgp_state_resource_syntax/
          retention-days: 30
