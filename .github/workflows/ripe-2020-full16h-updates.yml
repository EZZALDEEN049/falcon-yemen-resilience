name: FALCON 2020 Full 16h RRC00 Updates
on:
  push:
    branches: [main]
    paths:
      - .github/2020-full-updates-trigger.txt
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      FALCON_CHUNK: ${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pybgpkit-parser
      - uses: actions/download-artifact@v4
        with:
          name: bgp-discovery-30873-rrc00
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 39879372678
          github-token: ${{ github.token }}
          path: _tmp/30873
      - uses: actions/download-artifact@v4
        with:
          name: bgp-discovery-12486-rrc00
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 39879372678
          github-token: ${{ github.token }}
          path: _tmp/12486
      - run: python tools/ripe_2020_full_16h_updates_chunk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 2020-rrc00-mrt-aw-chunk-${{ matrix.chunk }}
          path: _artifacts/2020_full_update_chunk_${{ matrix.chunk }}/
          retention-days: 30
