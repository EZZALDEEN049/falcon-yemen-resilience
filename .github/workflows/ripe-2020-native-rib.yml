name: RIPE 2020 Native RIB Pilot
on:
  push:
    branches: [main]
    paths: ['.github/ripe-native-rib-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install auditable MRT parser
        run: python -m pip install pybgpkit-parser
      - name: Download and validate 2020 rrc00 MRT RIB snapshots
        run: python tools/ripe_2020_native_rib_pilot.py
      - name: Preserve only summary evidence and source checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripe-2020-rrc00-native-rib-pilot
          path: _artifacts/2020_ripe_rib_pilot/
          retention-days: 30
