name: USC 2020 active probing analysis synthetic tests
on:
  push:
    branches: [main]
    paths: ['.github/usc-a39-analysis-test-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest -v tools/test_usc_2020_trinocular_a39.py
