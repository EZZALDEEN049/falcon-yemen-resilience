name: Preserve Complete RIPE 2020 MRT Evidence
on:
  push:
    branches: [main]
    paths:
      - .github/2020-archive-manifest-trigger.txt
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: 2020-rrc00-mrt-aw-chunk-*
          repository: EZZALDEEN049/falcon-yemen-resilience
          run-id: 40250556262
          github-token: ${{ github.token }}
          path: _tmp/2020_16h_downloads
      - name: Aggregate 192 original provenance hashes and fail closed on any gap
        run: python tools/aggregate_ripe_2020_16h_original_manifest.py
      - name: Commit permanent internal research audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ripe_2020_source_original_16h_aw_manifest.json docs/RIPE_2020_FULL16H_SOURCE_MRT_AW_AUDIT.md
          git diff --cached --quiet || (git commit -m "Preserve full 2020 16-hour MRT A/W SHA256 audit" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permanent-2020-rrc00-16h-audit
          path: |
            results/ripe_2020_source_original_16h_aw_manifest.json
            docs/RIPE_2020_FULL16H_SOURCE_MRT_AW_AUDIT.md
          retention-days: 30
