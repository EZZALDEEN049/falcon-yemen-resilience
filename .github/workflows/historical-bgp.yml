name: Historical BGP Discovery
on:
  workflow_dispatch:
    inputs:
      asn:
        description: Target origin ASN
        type: choice
        options:
          - '30873'
          - '12486'
        default: '30873'
        required: true
      collector:
        description: RIS collector
        type: choice
        options:
          - rrc00
          - rrc01
          - rrc04
        default: rrc00
        required: true
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Pull official CAIDA BGPStream container
        run: docker pull caida/bgpstream:latest
      - name: Query Jan 9 2020 candidate RIB observations
        env:
          ASN: ${{ inputs.asn }}
          COLLECTOR: ${{ inputs.collector }}
        run: |
          mkdir -p _artifacts/bgp
          START=$(date -u -d '2020-01-09 08:00:00 UTC' +%s)
          END=$(date -u -d '2020-01-09 08:45:00 UTC' +%s)
          docker run --rm caida/bgpstream:latest bgpreader -p ris -c "$COLLECTOR" -w "$START,$END" -t ribs -a "$ASN" > _artifacts/bgp/historical_origin_rib_candidates.txt
          python tools/audit_bgp_discovery.py --input _artifacts/bgp/historical_origin_rib_candidates.txt --asn "$ASN" --collector "$COLLECTOR" --out _artifacts/bgp
      - name: Upload discovery evidence (not route-reconstruction results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgp-candidate-inventory-${{ inputs.asn }}-${{ inputs.collector }}
          path: _artifacts/bgp/
          if-no-files-found: warn
          retention-days: 14
