name: Independent 2020 RIPE RRC10 peer coverage
on:
  push:
    branches: [main]
    paths: ['.github/rrc10-history-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FALCON_RRC: rrc10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pybgpkit-parser
      - run: python tools/peer_qualified_rib_2020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independently-checked-2020-rrc10
          path: _artifacts/2020_ripe_peer_coverage_rrc10/
          retention-days: 30
