name: RIPEstat 2020 Routing Checkpoints
on:
  push:
    branches: [main]
    paths: ['.github/ripe-2020-trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query historical routing status with exact UTC checkpoint audit
        run: python tools/ripe_2020_checkpoints.py
      - name: Archive original response and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripe-2020-historical-checkpoints
          path: _artifacts/ripe_2020/
          retention-days: 30
